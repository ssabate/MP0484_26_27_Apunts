name: Publica el lloc amb Jekyll

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v4
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Construeix el lloc amb Jekyll
        uses: actions/jekyll-build-pages@v1
      - name: Puja l’artefacte de GitHub Pages
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica el lloc
        id: deployment
        uses: actions/deploy-pages@v4
